# Render Blueprint — ANT-MICI Antarctic Wilderness Values Dashboard v2
# Deploy: Render Dashboard → New → Blueprint → connect repo
#
# Creates two services:
#   1. ant-mici-api       — FastAPI analytics (Docker, GDAL)
#   2. ant-mici-dashboard — React static site (Vite)

services:
  - type: web
    name: ant-mici-api
    runtime: docker
    rootDir: backend
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: PYTHONPATH
        value: /app
      - key: PORT
        value: "8000"

  - type: web
    name: ant-mici-dashboard
    runtime: static
    rootDir: frontend
    buildCommand: chmod +x scripts/render-build.sh && ./scripts/render-build.sh
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: API_HOST
        fromService:
          type: web
          name: ant-mici-api
          envVarKey: RENDER_EXTERNAL_URL
