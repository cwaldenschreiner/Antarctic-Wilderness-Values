# Render Blueprint — ANT-MICI Antarctic Wilderness Values Dashboard
# Deploy: Render Dashboard → New → Blueprint → connect this repo
#
# Creates two services:
#   1. ant-mici-api       — FastAPI analytics (Docker)
#   2. ant-mici-dashboard — React static site (VITE_API_URL from API_HOST)

services:
  - type: web
    name: ant-mici-api
    runtime: docker
    rootDir: backend
    plan: starter
    healthCheckPath: /api/health
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    buildCommand: python scripts/setup_basemap.py && python scripts/validate_geospatial.py
    envVars:
      - key: PYTHONPATH
        value: /app
      - key: GRID_RES_M
        value: "20000"
      - key: MAX_GRID_CELLS
        value: "120000"
      - key: MAX_RASTER_DIM
        value: "512"

  - type: web
    name: ant-mici-dashboard
    runtime: static
    rootDir: frontend
    buildCommand: chmod +x scripts/render-build.sh && ./scripts/render-build.sh
    # Path is relative to REPO ROOT (not rootDir), so use frontend/dist
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: API_HOST
        fromService:
          type: web
          name: ant-mici-api
          envVarKey: RENDER_EXTERNAL_URL
